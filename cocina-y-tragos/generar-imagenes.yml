name: Generar imágenes

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Máximo de imágenes en esta corrida (0 = todas las pendientes)'
        default: '0'
      solo_ids:
        description: 'Opcional: ids separados por coma para generar solo esas'
        default: ''
      calidad:
        description: 'Calidad (low, medium, high)'
        default: 'medium'

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33
      - run: node generar-imagenes.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIMITE: ${{ inputs.limite }}
          SOLO_IDS: ${{ inputs.solo_ids }}
          IMAGE_QUALITY: ${{ inputs.calidad }}
